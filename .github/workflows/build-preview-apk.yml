name: Build NOVA Preview APK

on:
  push:
    branches: ['codex/apk-build-*']
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      validation:
        description: 'Preview for quick Shield testing; full for milestone validation'
        required: true
        default: preview
        type: choice
        options: [preview, full]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build isolated Preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VALIDATION_MODE: ${{ inputs.validation || 'preview' }}
      APK_VARIANT: release

    steps:
      - name: Check out the triggering Video revision
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Install NOVA build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file git meson nasm ninja-build pkg-config unzip wget

      - name: Install repo tool
        run: |
          curl --fail --location https://storage.googleapis.com/git-repo-downloads/repo | sudo tee /usr/local/bin/repo > /dev/null
          sudo chmod a+x /usr/local/bin/repo

      - name: Check out pinned NOVA source and prebuilts
        run: |
          mkdir nova
          cd nova
          repo init -u https://github.com/nova-video-player/aos-AVP -b 9c5842b74ab180c99441ed23fdd5d508448388a7 -m v6_4.xml
          cp ../source/.github/build/nova-ci.xml .repo/manifests/v6_4.xml
          if ! repo sync --no-manifest-update -c -d -j 4; then
            # Some prebuilt histories are not reachable through the default branch.
            # Seed the exact pinned objects, then let repo finish normal checkout.
            git --git-dir=.repo/projects/native/prebuilt/ffmpeg.git fetch --depth=1 https://github.com/nova-video-player/prebuilt-ffmpeg.git 6ba0e9340cf725bede2e2f29d30c290a2ab8130e
            git --git-dir=.repo/projects/native/prebuilt/opus.git fetch --depth=1 https://github.com/nova-video-player/prebuilt-opus.git 27544063be93ee55c6ba58a2ebb32c106eb2e37b
            repo sync --no-manifest-update -c -d -j 4
          fi

      - name: Overlay the triggering Video revision
        working-directory: nova/Video
        run: |
          git fetch ../../source HEAD
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$(git -C ../../source rev-parse HEAD)"
          cd ..
          repo manifest -r -o source-manifest.xml

      - name: Apply bounded Preview 4.0 scan scheduling correction
        working-directory: nova/MediaLib
        run: git apply ../Video/.github/build/medialib-preview40.patch

      - name: Isolate Preview package and content providers
        run: python3 source/.github/build/prepare-preview.py nova

      # The pinned FileCoreLibrary declares the published NOVA jcifs-ng package,
      # including its Maven dependency metadata. Do not stage a second bare JAR.
      - name: Set up Java 17 for Android Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            source/**/*.gradle*
            source/gradle/wrapper/gradle-wrapper.properties

      - name: Retain personal development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nova-mark-debug-signing-v1

      - name: Require the existing personal signing identity
        env:
          NOVA_SIGNING_KEY_BASE64: ${{ secrets.NOVA_SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$NOVA_SIGNING_KEY_BASE64" ]; then
            mkdir -p ~/.android
            printf '%s' "$NOVA_SIGNING_KEY_BASE64" | base64 --decode > ~/.android/debug.keystore
            chmod 600 ~/.android/debug.keystore
          fi
          test -s ~/.android/debug.keystore || { echo "Existing signing key unavailable; refusing to generate a different identity."; exit 1; }
          keytool -exportcert -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -file /tmp/nova-signing-certificate.der
          echo "89ac087ed6f989c90482d4a999f80511fe6ceee26ef1b9c37a142a9f00d39a5a  /tmp/nova-signing-certificate.der" | sha256sum --check
          echo "89ac087ed6f989c90482d4a999f80511fe6ceee26ef1b9c37a142a9f00d39a5a" > nova/preview-certificate-sha256.txt

      - name: Test personal build changes
        if: ${{ inputs.validation == 'full' }}
        working-directory: nova/Video
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew testNoamazonDebugUnitTest --tests 'com.archos.mediacenter.video.streaming.*' --tests 'com.archos.mediacenter.video.utils.MarkChangesTest' --tests 'com.archos.mediacenter.video.leanback.TopNavigationTest' --tests 'com.archos.mediacenter.video.leanback.PreviewPagesTest' --tests 'com.archos.mediacenter.video.leanback.PreviewDiscoveryTest' --tests 'com.archos.mediacenter.video.leanback.PreviewMoviePageTest' --tests 'com.archos.mediacenter.video.leanback.PreviewStartupTest' -Puniversal -PmarkPreview --no-daemon --stacktrace 2>&1 | tee ../gradle-tests.log

      - name: Build signed development APK
        working-directory: nova/Video
        run: |
          set -o pipefail
          chmod +x gradlew
          extra_args=()
          # Preview delivery defers lint and optimisation to the full milestone run.
          if [[ "$VALIDATION_MODE" == preview ]]; then extra_args+=(-x lintNoamazonDebug); fi
          ./gradlew assembleNoamazonDebug -Puniversal -PmarkPreview "${extra_args[@]}" --build-cache --no-daemon 2>&1 | tee ../gradle-debug-build.log

      - name: Quick targeted library metadata checks
        if: ${{ inputs.validation != 'full' }}
        working-directory: nova/Video
        run: |
          ./gradlew testNoamazonDebugUnitTest --tests 'com.archos.mediacenter.video.leanback.PreviewPagesTest.tvPremiereUses64BitDateInsteadOfTruncatedTimestamp' --tests 'com.archos.mediacenter.video.leanback.PreviewPagesTest.resumeWinsAndCompletionAdvancesRetrospectively' --tests 'com.archos.mediacenter.video.leanback.PreviewPagesTest.renderActualPagesAndCheckTabFocus' --tests 'com.archos.mediacenter.video.leanback.PreviewMoviePageTest.*' --tests 'com.archos.mediacenter.video.leanback.Preview411Test.*' --tests 'com.archos.mediacenter.video.streaming.StreamingPreferencesTest.*' --tests 'com.archos.mediacenter.video.leanback.Preview41ProgressTest.*' --tests 'com.archos.mediacenter.video.utils.VerifiedBackupTest.*' --tests 'com.archos.mediacenter.video.leanback.Preview41RowsTest.*' --tests 'com.archos.mediacenter.video.player.PreviewUpNextTest.*' --tests 'com.archos.mediacenter.video.player.PlaybackResumePolicyTest.*' --tests 'com.archos.mediacenter.video.leanback.PreviewPagesTest.tvStorageAggregatesLibraryFilesAndSortsUnknownLast' -Puniversal -PmarkPreview --build-cache --no-daemon

      - name: Start Android emulator for full process startup checks
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          mkdir -p nova/startup-diagnostics
          export ANDROID_AVD_HOME="$RUNNER_TEMP/nova-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-28;google_apis;x86_64' 'emulator' > nova/startup-diagnostics/sdk-startup.log
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name nova-startup --package 'system-images;android-28;google_apis;x86_64'
          # Configure the physical panel; wm size alone leaves a portrait skin.
          sed -i -E '/^(hw.lcd.(width|height|density)|skin.name|skin.path)=/d' "$ANDROID_AVD_HOME/nova-startup.avd/config.ini"
          cat >> "$ANDROID_AVD_HOME/nova-startup.avd/config.ini" <<'AVD'
          hw.lcd.width=1920
          hw.lcd.height=1080
          hw.lcd.density=320
          skin.name=1920x1080
          skin.path=_no_skin
          AVD
          "$ANDROID_HOME/emulator/emulator" -avd nova-startup -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 > nova/startup-diagnostics/emulator-startup.log 2>&1 &
          timeout 180 adb wait-for-device
          timeout 180 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 2; done'
          adb shell wm size 1920x1080
          adb shell wm density 320
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 0
          adb shell input keyevent 82

      - name: Check full app startup with Preview enabled
        working-directory: nova/Video
        run: |
          apk=$(find build/outputs/apk/noamazon/debug -name '*.apk' -type f | head -1)
          phase=debug
          if [[ "$VALIDATION_MODE" == preview ]]; then phase=preview; fi
          bash .github/build/check-preview-startup.sh "$apk" "$phase"

      - name: Build optimised personal APK
        if: env.APK_VARIANT == 'release'
        working-directory: nova/Video
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleNoamazonRelease -PmarkSigning -Puniversal -PmarkPreview --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Check signed release upgrade with Preview still enabled
        if: env.APK_VARIANT == 'release'
        working-directory: nova/Video
        run: |
          apk=$(find build/outputs/apk/noamazon/release -name '*.apk' -type f | head -1)
          bash .github/build/check-preview-startup.sh "$apk" release

      - name: Verify APK signature and list native libraries
        run: |
          mapfile -t apks < <(find "nova/Video/build/outputs/apk/noamazon/$APK_VARIANT" -name '*.apk' -type f)
          test "${#apks[@]}" -eq 1
          [[ "${apks[0]}" == *org.courville.nova.markpreview-* ]]
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/apksigner" verify --verbose --print-certs "${apks[0]}" | tee nova/apk-verification.log
          grep -qi "$(cat nova/preview-certificate-sha256.txt)" nova/apk-verification.log
          unzip -l "${apks[0]}" 'lib/*' | tee -a nova/apk-verification.log
          sha256sum "${apks[0]}" | tee nova/apk-sha256.txt

      - name: Record validation mode
        run: |
          {
            echo "Source: $GITHUB_SHA"
            echo "Mode: $VALIDATION_MODE"
            echo "APK variant: $APK_VARIANT"
            if [[ "$VALIDATION_MODE" == preview ]]; then
              echo "Passed: compile/package, quick targeted tests, pinned signature, Preview launch/reinstall; release upgrade/restart only when APK variant is release."
              echo "Deferred: broad unit suite and physical TV playback/network/library QA."
              echo "Development checkpoint; physical Shield acceptance remains user QA."
            else
              echo "Passed: selected unit suite, lint, classic/Preview startup and signed diagnostic-to-release upgrade/restart."
            fi
          } > nova/build-validation.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: |
            nova/gradle-build.log
            nova/gradle-debug-build.log
            nova/build-validation.txt
            nova/gradle-tests.log
            nova/startup-diagnostics/
            nova/Video/build/reports/tests/
            nova/Video/build/reports/preview-ui/
            nova/Video/docs/MARK-EDITION-3.md
            nova/source-manifest.xml
            nova/apk-verification.log
            nova/preview-certificate-sha256.txt
            nova/apk-sha256.txt
            nova/Video/build/reports/lint-results-*
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-preview-${{ env.VALIDATION_MODE }}-apk
          path: nova/Video/build/outputs/apk/noamazon/${{ env.APK_VARIANT }}/*.apk
          if-no-files-found: error
