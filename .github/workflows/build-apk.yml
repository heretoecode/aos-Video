name: Build NOVA APK

on:
  push:
    branches: [v6.4]
  pull_request:
    branches: [v6.4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    # Personal Preview branches use build-preview-apk.yml instead of this legacy package.
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'codex/apk-build-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the triggering Video revision
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Install NOVA build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file git meson nasm ninja-build pkg-config unzip wget

      - name: Install repo tool
        run: |
          curl --fail --location https://storage.googleapis.com/git-repo-downloads/repo | sudo tee /usr/local/bin/repo > /dev/null
          sudo chmod a+x /usr/local/bin/repo

      - name: Check out pinned NOVA source and prebuilts
        run: |
          mkdir nova
          cd nova
          repo init -u https://github.com/nova-video-player/aos-AVP -b 9c5842b74ab180c99441ed23fdd5d508448388a7 -m v6_4.xml
          cp ../source/.github/build/nova-ci.xml .repo/manifests/v6_4.xml
          if ! repo sync --no-manifest-update -c -d -j 4; then
            # Some prebuilt histories are not reachable through the default branch.
            # Seed the exact pinned objects, then let repo finish normal checkout.
            git --git-dir=.repo/projects/native/prebuilt/ffmpeg.git fetch --depth=1 https://github.com/nova-video-player/prebuilt-ffmpeg.git 6ba0e9340cf725bede2e2f29d30c290a2ab8130e
            git --git-dir=.repo/projects/native/prebuilt/opus.git fetch --depth=1 https://github.com/nova-video-player/prebuilt-opus.git 27544063be93ee55c6ba58a2ebb32c106eb2e37b
            repo sync --no-manifest-update -c -d -j 4
          fi

      - name: Overlay the triggering Video revision
        working-directory: nova/Video
        run: |
          git fetch ../../source HEAD
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$(git -C ../../source rev-parse HEAD)"
          cd ..
          repo manifest -r -o source-manifest.xml

      # The pinned FileCoreLibrary declares the published NOVA jcifs-ng package,
      # including its Maven dependency metadata. Do not stage a second bare JAR.
      - name: Set up Java 17 for Android Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            source/**/*.gradle*
            source/gradle/wrapper/gradle-wrapper.properties

      - name: Retain personal development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nova-mark-debug-signing-v1

      - name: Require the existing personal signing identity
        env:
          NOVA_SIGNING_KEY_BASE64: ${{ secrets.NOVA_SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$NOVA_SIGNING_KEY_BASE64" ]; then
            mkdir -p ~/.android
            printf '%s' "$NOVA_SIGNING_KEY_BASE64" | base64 --decode > ~/.android/debug.keystore
            chmod 600 ~/.android/debug.keystore
          fi
          test -s ~/.android/debug.keystore || { echo "Existing signing key unavailable; refusing to generate a different identity."; exit 1; }
          keytool -exportcert -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -file /tmp/nova-signing-certificate.der
          echo "f950a2b660da24419315b35cd8cf598cd03587faf239b1d160c544e6c060177f  /tmp/nova-signing-certificate.der" | sha256sum --check

      - name: Test personal build changes
        working-directory: nova/Video
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew testNoamazonDebugUnitTest --tests 'com.archos.mediacenter.video.streaming.*' --tests 'com.archos.mediacenter.video.utils.MarkChangesTest' --tests 'com.archos.mediacenter.video.leanback.TopNavigationTest' -Puniversal --no-daemon --stacktrace 2>&1 | tee ../gradle-tests.log

      - name: Build optimised personal APK
        working-directory: nova/Video
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleNoamazonRelease -PmarkSigning -Puniversal --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Verify APK signature and list native libraries
        run: |
          mapfile -t apks < <(find nova/Video/build/outputs/apk/noamazon/release -name '*.apk' -type f)
          test "${#apks[@]}" -eq 1
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/apksigner" verify --verbose --print-certs "${apks[0]}" | tee nova/apk-verification.log
          grep -qi 'f950a2b660da24419315b35cd8cf598cd03587faf239b1d160c544e6c060177f' nova/apk-verification.log
          unzip -l "${apks[0]}" 'lib/*' | tee -a nova/apk-verification.log
          sha256sum "${apks[0]}" | tee nova/apk-sha256.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: |
            nova/gradle-build.log
            nova/gradle-tests.log
            nova/Video/build/reports/tests/
            nova/Video/docs/MARK-EDITION-3.md
            nova/source-manifest.xml
            nova/apk-verification.log
            nova/apk-sha256.txt
            nova/Video/build/reports/lint-results-*
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-mark-edition-3-apk
          path: nova/Video/build/outputs/apk/noamazon/release/*.apk
          if-no-files-found: error
